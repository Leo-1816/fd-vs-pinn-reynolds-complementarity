[project]
name = "pri"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pytest>=9.2.0",
    "scipy>=1.18.1",
    "torch>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.uv.build-backend]
module-name = ["pri", "pinn"]

[dependency-groups]
dev = [
    "furo>=2025.12.19",
    "sphinx>=9.2.0",
    "sphinxcontrib-bibtex>=2.7.0",
]
